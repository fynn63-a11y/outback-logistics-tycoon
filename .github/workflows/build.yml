name: build

on:
  push:
    branches: [main, "vibe/*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile
        run: ./build.sh
      - name: Smoke (Texturen exportieren)
        run: ./generate-textures.sh
      - name: Upload classes
        uses: actions/upload-artifact@v4
        with:
          name: outback-classes
          path: out/
